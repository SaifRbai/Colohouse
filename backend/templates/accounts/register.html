{% extends "base.html" %}
{% block title %}Inscription{% endblock %}

{% block content %}
<div class="panel panel-narrow">
  <h1>Créer un compte</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <p class="muted small">Mot de passe : 10 caractères minimum.</p>
    <button type="submit" class="btn btn-block">S'inscrire</button>
  </form>
  <p class="form-foot">Déjà inscrit ? <a href="{% url 'web:login' %}">Connecte-toi</a></p>
</div>
{% endblock %}
